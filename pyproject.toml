[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-prep"
version = "0.1.0"
description = "Prepara áudio para tocar em plasma speaker / mini bobina de Tesla musical"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "mido"]

[project.optional-dependencies]
separate = ["demucs"]
youtube = ["yt-dlp"]
# áudio -> notas; no Linux exige Python 3.10 ou 3.11. numpy<2 (TensorFlow) e setuptools<81 (resampy usa pkg_resources)
midi = ["basic-pitch", "numpy<2", "setuptools<81"]
dev = ["pytest", "ruff"]

[project.scripts]
coil-prep = "coil_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
