[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-prep"
version = "0.1.0"
description = "Prepara áudio para tocar em plasma speaker / mini bobina de Tesla musical"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "mido", "yt-dlp[default]", "fastapi", "uvicorn", "python-multipart", "pynbs"]

[project.optional-dependencies]
separate = ["demucs"]
# áudio -> notas; no Linux exige Python 3.10 ou 3.11. numpy<2 (TensorFlow) e setuptools<81 (resampy usa pkg_resources)
midi = ["basic-pitch", "numpy<2", "setuptools<81"]
# mesmas dependências do Basic Pitch SEM o TensorFlow (~2 GB): o pacote traz o modelo ONNX e roda com
# onnxruntime. Exige instalar o basic-pitch com `pip install --no-deps basic-pitch` (o Dockerfile faz isso)
midi-onnx = [
  "onnxruntime", "librosa>=0.8", "resampy<0.4.3,>=0.2.2", "mir_eval>=0.6", "pretty_midi>=0.2.9",
  "scipy>=1.4.1", "scikit-learn", "typing-extensions", "setuptools<81",
]
# mir_eval: métrica nota a nota de coil_prep.evaluate (sem ele esses testes são pulados)
dev = ["pytest", "ruff", "httpx", "mir_eval"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coil_prep.web" = ["static/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
